name = "bot-override-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# D1 数据库绑定 —— 部署后会自动创建
[[d1_databases]]
binding = "DB"
database_name = "bot-overrides-db"
database_id = ""

# ── 环境变量 ──
[vars]
# API 鉴权密钥（请在 Cloudflare Dashboard 或 wrangler secret 中设置）
# AUTH_TOKEN: 用于 Python 客户端调用时的 Bearer Token 鉴权
# 部署后运行: wrangler secret put AUTH_TOKEN

# 允许跨域访问（开发时可以用 *）
ALLOWED_ORIGIN = "*"

# ── 可选的用量限制 ──
# ADMIN_USER_IDS: 逗号分隔的 Telegram 用户 ID（暂未使用，由 Bot 端鉴权）